# Clinical AI Copilot — Alembic configuration.
#
# NOTE: the real database URL is injected from application settings
# (environment variables / .env) inside alembic/env.py, so this file
# never contains real credentials.

[alembic]
script_location = alembic
prepend_sys_path = .
# Placeholder — overridden by app settings in alembic/env.py:
sqlalchemy.url = postgresql+psycopg2://user:password@localhost:5432/clinical_ai_copilot

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
