# ============================================================
# Clinical AI Copilot — production Nginx (HTTP stage; TLS = later task)
#
# Routing:
#   APP_DOMAIN (default server) ── /            → frontend:3000
#                                ── /api/       → backend:8000
#                                ── /health     → backend:8000
#   storage.<domain>            ── /*           → minio:9000   (presigned)
#
# STORAGE / PRESIGNED DESIGN (read before changing):
#   The backend signs presigned URLs with MINIO_ENDPOINT as the S3 Host.
#   For the browser to use them, MINIO_ENDPOINT must be the PUBLIC storage
#   hostname (NOT minio:9000) and Nginx must forward that exact Host to
#   MinIO — otherwise the S3 signature check fails. The backend reaches
#   this same public hostname through the compose `extra_hosts` mapping
#   (host-gateway → published Nginx port).
#
#   Replace `storage.local.test` with `storage.<your-domain>`:
#     - here (server_name)
#     - compose: STORAGE_PUBLIC_HOST (drives MINIO_ENDPOINT + extra_hosts)
#   After TLS: MINIO_SECURE=true in the backend environment.
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Backend upload limit is 20 MB — leave headroom.
    client_max_body_size 25m;

    # ------------------------------------------ main application
    server {
        listen 80 default_server;
        # TODO(domain): replace _ with your real domain, e.g. demo.example.com
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Infrastructure probe → backend (non-versioned health endpoint)
        location = /health {
            proxy_pass http://backend:8000;
        }

        # REST API — AI/STT/document operations can take a while.
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Everything else → Next.js
        location / {
            proxy_pass http://frontend:3000;
            proxy_read_timeout 60s;
        }
    }

    # ------------------------------------------ object storage (presigned)
    server {
        listen 80;
        # TODO(domain): replace with storage.<your-domain> (keep wildcard
        # harmless; minio-py uses path-style URLs).
        server_name storage.local.test *.storage.local.test;

        proxy_http_version 1.1;
        # CRITICAL: the S3 signature covers this exact Host — do NOT change.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 25m;

        location / {
            proxy_pass http://minio:9000;
            proxy_read_timeout 120s;
        }
    }
}
